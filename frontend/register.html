<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Kayıt Ol | Kamp Rehberi</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                  url('https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    form {
      margin: auto !important;
      background: rgba(255, 255, 255, 0.92);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
    }

    form h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1b4332;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    input {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: all 0.3s ease;
      margin-bottom: 10px;
      background-color: #1b4332;
      color: white;
    }

    button:hover {
      background-color: #2d6a4f;
      transform: scale(1.02);
    }

    .login-link {
      text-align: center;
      font-size: 14px;
      margin-top: 10px;
    }

    .login-link a {
      color: #1b4332;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    header {
      width: 100%;
      background: rgba(27, 67, 50, 0.8);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🏕️ Kamp Rehberi</div>
  <nav>
    <a href="/campgrounds.html">Kamp Alanları</a>
    <a href="/videos.html">Videolar</a>
    <a href="/articles.html">Bilgiler</a>
    <a href="/index.html">Ana Sayfa</a>
  </nav>
</header>

<form action="/register" method="POST">
  <h2>Kayıt Ol</h2>
  <input type="email" name="email" placeholder="E-mail" required />
  <input type="password" name="password" placeholder="Şifre" required />
  <button type="submit">Kayıt Ol</button>

  <div class="login-link">
    Zaten üye misin? <a href="/login">Giriş Yap</a>
  </div>
</form>

</body>
</html>
